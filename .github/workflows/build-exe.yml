name: Build Windows .exe

on:
  push:
    branches: [feat/windows-gui-exe]
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest
    env:
      # Explicit, workflow-wide cache path so the pre-download step and the
      # PyInstaller spec agree on where to find/bundle PaddleX models.
      # Using os.path.expanduser("~/.paddlex") in the spec was unreliable
      # because HOME on Actions runners differs between steps.
      PADDLE_PDX_CACHE_HOME: ${{ github.workspace }}\paddle_cache

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Pre-download PaddleOCR models
        run: |
          echo "PADDLE_PDX_CACHE_HOME=$env:PADDLE_PDX_CACHE_HOME"
          python -c "from providers.paddleocr_provider import _get_ocr; _get_ocr()"
          echo "--- Contents of cache dir after download ---"
          Get-ChildItem -Recurse -Depth 2 "$env:PADDLE_PDX_CACHE_HOME" | Select-Object FullName | Format-Table -AutoSize

      - name: Build .exe with PyInstaller
        run: pyinstaller twist_qc_gui.spec --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwistQC-Windows
          path: dist/TwistQC/
          retention-days: 30
